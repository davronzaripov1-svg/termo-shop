server {
    listen 80;
    listen [::]:80;
    server_name termostick.uz www.termostick.uz;

    root /var/www/termostick/dist;
    index index.html;

    # Логи
    access_log /var/log/nginx/termostick-access.log;
    error_log /var/log/nginx/termostick-error.log;

    # Gzip сжатие для улучшения производительности
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    gzip_disable "msie6";

    # Кэширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Кэширование HTML файлов (короткое время)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # SPA routing - все запросы перенаправляем на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Безопасность заголовков
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Отключить отображение версии Nginx
    server_tokens off;

    # Ограничение размера загружаемых файлов (если будет форма загрузки)
    client_max_body_size 10M;
}